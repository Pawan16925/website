    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #7c3aed;
            --accent-color: #10b981; /* Green for "Online" status */
            --bg-dark: #0a0a1a;
            --bg-medium: #1a1a2e;
            --text-primary: #f0f0f5;
            --text-secondary: #a0a0b5;
            --border-color: rgba(255, 255, 255, 0.1);
            --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.3);
            --radius-lg: 1rem;
            --transition-speed: 0.4s;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.7;
        }
        
        /* --- Pre-loader --- */
        .preloader {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--bg-dark);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .preloader.hidden { opacity: 0; visibility: hidden; }
        .spinner {
            width: 50px; height: 50px;
            border: 5px solid var(--bg-medium);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- Header (Consistent) --- */
        .header {
            background-color: rgba(10, 10, 26, 0.8); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 1.5rem; position: sticky; top: 0; z-index: 1000;
        }
        .header-container { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo img { height: 40px; }
        .nav-links { display: flex; list-style: none; }
        .nav-links a { color: var(--text-primary); text-decoration: none; margin: 0 1rem; font-weight: 600; position: relative; transition: color 0.3s ease; }
        .nav-links a::after { content: ''; position: absolute; width: 0; height: 2px; bottom: -5px; left: 50%; transform: translateX(-50%); background-color: var(--primary-color); transition: width 0.3s ease; }
        .nav-links a:hover, .nav-links a.active { color: var(--primary-color); }
        .nav-links a:hover::after, .nav-links a.active::after { width: 100%; }
        .menu-toggle { display: none; font-size: 1.5rem; cursor: pointer; }
        
        /* --- Main Verification Section --- */
        .verify-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6rem 1.5rem;
            position: relative;
            overflow: hidden;
        }
        #particle-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        .verify-container {
            max-width: 600px;
            width: 100%;
            padding: 2.5rem;
            background: rgba(26, 26, 46, 0.8);
            backdrop-filter: blur(15px);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            text-align: center;
            position: relative;
            z-index: 2;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }

        /* Glowing Border Effect */
        .verify-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: var(--radius-lg);
            padding: 2px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: pulse-glow 4s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .verify-icon {
            font-size: 2.5rem;
            color: var(--primary-color);
            margin: 0 auto 1.5rem;
            text-shadow: 0 0 15px var(--primary-color);
        }
        
        .verify-title {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .verify-description {
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .server-buttons { display: grid; grid-template-columns: 1fr; gap: 1rem; }
        .server-button {
            padding: 1rem;
            font-size: 1.1rem;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            background-color: transparent;
            color: var(--text-primary);
            position: relative;
            overflow: hidden;
        }

        .server-button:hover {
            border-color: var(--primary-color);
            color: #fff;
            box-shadow: 0 0 20px rgba(79, 70, 229, 0.5);
        }

        /* Scanline Effect on Hover */
        .server-button::after {
            content: '';
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0));
            transform: skewY(45deg);
            transition: top 0.5s ease;
        }
        .server-button:hover::after {
            top: 100%;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--accent-color);
            box-shadow: 0 0 8px var(--accent-color);
            animation: pulse-status 2s infinite;
        }
        @keyframes pulse-status {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Footer (Consistent) */
        .footer { background-color: var(--bg-dark); border-top: 1px solid var(--border-color); color: var(--text-secondary); padding: 5rem 1.5rem 2rem; text-align: center; }
        .footer-bottom p { margin: 0; }

        /* --- Responsive Design --- */
        @media (max-width: 768px) {
            .nav-links { display: none; position: absolute; top: 70px; left: 0; width: 100%; background: var(--bg-dark); flex-direction: column; padding: 2rem 0; box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
            .nav-links.active { display: flex; }
            .menu-toggle { display: block; }
            .server-buttons { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>

                    Verify the authenticity of any StaxTech certificate using our secure, decentralized verification system. Choose a server to begin.
                </p>

    <footer class="footer">

            <p>&copy; <span id="currentYear"></span> StaxTech. All Rights Reserved. | MSME Registered</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // --- Preloader ---
            const preloader = document.getElementById('preloader');
            window.addEventListener('load', () => {
                preloader.classList.add('hidden');
            });

            // --- Interactive Particle Background ---
            const canvas = document.getElementById('particle-canvas');
            if(canvas) {
                const ctx = canvas.getContext('2d');
                canvas.width = window.innerWidth;
                canvas.height = document.body.scrollHeight; // Make canvas cover full page height
                let particles = [];
                
                class Particle {
                    constructor(x, y, dirX, dirY, size, color) { this.x = x; this.y = y; this.dirX = dirX; this.dirY = dirY; this.size = size; this.color = color; }
                    draw() {
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                        ctx.fillStyle = 'rgba(79, 70, 229, 0.4)';
                        ctx.fill();
                    }
                    update() {
                        if (this.x > canvas.width || this.x < 0) this.dirX = -this.dirX;
                        if (this.y > canvas.height || this.y < 0) this.dirY = -this.dirY;
                        this.x += this.dirX; this.y += this.dirY;
                        this.draw();
                    }
                }

                function initParticles() {
                    particles = [];
                    let numParticles = (canvas.height * canvas.width) / 12000;
                    for (let i = 0; i < numParticles; i++) {
                        let size = (Math.random() * 2) + 1;
                        let x = Math.random() * (innerWidth - size * 2);
                        let y = Math.random() * (innerHeight - size * 2);
                        let dirX = (Math.random() * .4) - .2;
                        let dirY = (Math.random() * .4) - .2;
                        particles.push(new Particle(x, y, dirX, dirY, size));
                    }
                }

                function animateParticles() {
                    requestAnimationFrame(animateParticles);
                    ctx.clearRect(0, 0, innerWidth, innerHeight);
                    for (let p of particles) { p.update(); }
                }
                
                initParticles();
                animateParticles();

                window.addEventListener('resize', () => {
                    canvas.width = window.innerWidth;
                    canvas.height = document.body.scrollHeight;
                    initParticles();
                });
            }
            
            // --- Intersection Observer for Fade-in ---
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));

            // --- Consistent Header, Menu, Footer Logic ---
            const header = document.getElementById('header');
            const menuToggle = document.getElementById('menu-toggle');
            const navLinks = document.getElementById('nav-links');
            document.getElementById('currentYear').textContent = new Date().getFullYear();
            menuToggle.addEventListener('click', () => navLinks.classList.toggle('active'));
            window.addEventListener('scroll', () => {
                if (header) header.classList.toggle('scrolled', window.scrollY > 50);
            });
        });
    </script>
