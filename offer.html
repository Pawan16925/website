<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StaxTech Offer Letter Finder & Portal</title>


      <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9005733002223091"
     crossorigin="anonymous"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #e0e7ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-card {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .action-card:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        .loader {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .fade-in-up {
            animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="p-4 sm:p-6 text-slate-800">

    <div class="w-full max-w-xl bg-white rounded-[2rem] shadow-[0_20px_50px_-12px_rgba(0,0,0,0.1)] overflow-hidden border border-slate-100 transition-all duration-300">
        
        <div class="bg-gradient-to-br from-blue-600 via-blue-700 to-indigo-800 text-white p-8 sm:p-10 text-center relative overflow-hidden">
            <div class="absolute top-[-20%] left-[-10%] w-40 h-40 bg-white/10 rounded-full blur-2xl"></div>
            <div class="absolute bottom-[-20%] right-[-10%] w-40 h-40 bg-blue-400/20 rounded-full blur-2xl"></div>

            <div class="relative z-10 w-20 h-20 rounded-2xl bg-white/15 backdrop-blur-sm flex items-center justify-center mx-auto mb-5 shadow-lg border border-white/20">
                <i class="ph ph-files text-4xl text-white"></i>
            </div>
            
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight relative z-10">StaxTech Portal</h1>
            <p class="mt-2 text-blue-100 font-medium relative z-10 opacity-90">Offer Letter & Internship Dashboard</p>
        </div>

        <div class="p-6 sm:p-8">
            <form id="searchForm" class="space-y-5 transition-all duration-500">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">
                        Registered Email or Phone Number
                    </label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="ph ph-magnifying-glass text-slate-400 group-focus-within:text-blue-500 transition-colors text-lg"></i>
                        </div>
                        <input 
                            type="text" 
                            id="query" 
                            placeholder="e.g., student@example.com" 
                            class="w-full border-2 border-slate-200 rounded-xl pl-11 pr-5 py-3.5 bg-slate-50 focus:bg-white focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all duration-200"
                        />
                    </div>
                </div>

                <button 
                    id="searchBtn" 
                    type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-bold py-3.5 rounded-xl transition-all duration-200 flex justify-center items-center gap-2 shadow-lg shadow-blue-500/30 hover:shadow-blue-500/40 disabled:opacity-70 disabled:cursor-not-allowed"
                >
                    <span id="btnText">Search Records</span>
                    <div id="btnLoader" class="loader hidden"></div>
                </button>
            </form>

            <div id="resultContainer" class="hidden mt-2 space-y-8">
                
                <div id="resultContent" class="fade-in-up"></div>

                <div id="quickLinksSection" class="hidden fade-in-up" style="animation-delay: 0.1s;">
                    <div class="flex items-center gap-3 mb-4">
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest">
                            Important Links
                        </h3>
                        <div class="h-px bg-slate-200 flex-1"></div>
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <a href="https://staxtech.in/project-submission" target="_blank" class="action-card flex items-center gap-3 bg-slate-50 hover:bg-blue-50/50 border border-slate-200 hover:border-blue-200 rounded-xl p-3.5 font-semibold text-slate-700 group">
                            <div class="w-10 h-10 rounded-lg bg-blue-100 flex items-center justify-center text-blue-600 group-hover:bg-blue-600 group-hover:text-white transition-colors">
                                <i class="ph ph-rocket-launch text-xl"></i>
                            </div>
                            <span class="text-sm">Submit Project</span>
                        </a>

                        <a href="https://staxtech.in/instructions" target="_blank" class="action-card flex items-center gap-3 bg-slate-50 hover:bg-amber-50/50 border border-slate-200 hover:border-amber-200 rounded-xl p-3.5 font-semibold text-slate-700 group">
                            <div class="w-10 h-10 rounded-lg bg-amber-100 flex items-center justify-center text-amber-600 group-hover:bg-amber-500 group-hover:text-white transition-colors">
                                <i class="ph ph-book-open text-xl"></i>
                            </div>
                            <span class="text-sm">Instructions</span>
                        </a>

                        <a href="https://www.linkedin.com/company/stax-tech/" target="_blank" class="action-card flex items-center gap-3 bg-slate-50 hover:bg-sky-50/50 border border-slate-200 hover:border-sky-200 rounded-xl p-3.5 font-semibold text-slate-700 group sm:col-span-2">
                            <div class="w-10 h-10 rounded-lg bg-sky-100 flex items-center justify-center text-sky-600 group-hover:bg-sky-600 group-hover:text-white transition-colors">
                                <i class="ph ph-linkedin-logo text-xl"></i>
                            </div>
                            <span class="text-sm">Follow StaxTech</span>
                        </a>
                    </div>
                    
                    <div class="text-center mt-6">
                        <button onclick="resetSearch()" class="text-sm font-semibold text-slate-500 hover:text-blue-600 transition-colors flex items-center justify-center gap-2 mx-auto">
                            <i class="ph ph-arrow-counter-clockwise"></i>
                            Search Another Record
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxKZLnhIYwEIouuTfxlyEehTyVMz14pcStu-3OPSEzprbH7HfD_N4_BOMX5ZwAhlRueFQ/exec";
const PROJECTS_URL = "https://drive.google.com/drive/folders/1kvnKaleE7i_2soNfTs99K3ikfcqLlvY8";

const queryInput = document.getElementById("query");
const resultContainer = document.getElementById("resultContainer");
const resultContent = document.getElementById("resultContent");
const quickLinksSection = document.getElementById("quickLinksSection");
const btnText = document.getElementById("btnText");
const btnLoader = document.getElementById("btnLoader");
const searchBtn = document.getElementById("searchBtn");
const searchForm = document.getElementById("searchForm");

searchForm.addEventListener("submit", function(event) {
    event.preventDefault(); 
    findOfferLetter();
});

// Function to reset the view if they want to search again
function resetSearch() {
    searchForm.classList.remove("hidden");
    resultContainer.classList.add("hidden");
    quickLinksSection.classList.add("hidden");
    queryInput.value = "";
    queryInput.focus();
}

function setLoading(loading) {
    if (loading) {
        btnText.classList.add("hidden");
        btnLoader.classList.remove("hidden");
        searchBtn.disabled = true;
        resultContainer.classList.add("hidden"); 
        quickLinksSection.classList.add("hidden");
    } else {
        btnText.classList.remove("hidden");
        btnLoader.classList.add("hidden");
        searchBtn.disabled = false;
    }
}

async function findOfferLetter() {
    const query = queryInput.value.trim();

    if (!query) {
        queryInput.classList.add('ring-2', 'ring-red-500');
        setTimeout(() => queryInput.classList.remove('ring-2', 'ring-red-500'), 1500);
        return;
    }

    setLoading(true);

    try {
        const response = await fetch(`${API_URL}?query=${encodeURIComponent(query)}`);
        const data = await response.json();

        resultContent.classList.remove("fade-in-up");
        void resultContent.offsetWidth; 
        resultContent.classList.add("fade-in-up");

        if (data.status === "success") {
            
            // HIDE THE SEARCH FORM UPON SUCCESS
            searchForm.classList.add("hidden");

            resultContent.innerHTML = `
                <div class="bg-white border-2 border-blue-100 rounded-[1.5rem] p-5 sm:p-6 shadow-[0_8px_30px_rgb(0,0,0,0.04)] relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-blue-50 rounded-full blur-2xl -mr-10 -mt-10 pointer-events-none"></div>
                    
                    <div class="flex items-center gap-4 relative z-10">
                        <div class="bg-gradient-to-br from-blue-100 to-indigo-100 p-3.5 rounded-2xl text-blue-700 shadow-sm border border-blue-200/50">
                            <i class="ph ph-user-circle-check text-3xl"></i>
                        </div>
                        <div>
                            <h2 class="text-xl sm:text-2xl font-bold text-slate-900 leading-tight">
                                ${data.name}
                            </h2>
                            <p class="text-blue-600 font-semibold text-sm mt-0.5">
                                ${data.domain}
                            </p>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 mt-6 relative z-10">
                        <div class="bg-slate-50 border border-slate-100 rounded-xl p-3 sm:p-4">
                            <div class="text-xs text-slate-500 font-semibold uppercase tracking-wider mb-1">
                                Deadline
                            </div>
                            <div class="font-bold text-slate-900 text-base sm:text-lg">
                                ${data.deadline || 'Not Available'}
                            </div>
                        </div>

                        <div class="bg-slate-50 border border-slate-100 rounded-xl p-3 sm:p-4">
                            <div class="text-xs text-slate-500 font-semibold uppercase tracking-wider mb-1">
                                Status
                            </div>
                            <div class="font-bold text-emerald-600 text-base sm:text-lg flex items-center gap-1.5">
                                <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                                ${data.current_status || 'Pending'}
                            </div>
                        </div>
                    </div>

                    <div class="space-y-3 mt-6 relative z-10">
                        <a href="${data.offerLetter}" target="_blank" class="action-card flex justify-between items-center bg-blue-600 hover:bg-blue-700 text-white rounded-xl p-4 font-semibold shadow-md shadow-blue-500/20">
                            <div class="flex items-center gap-3">
                                <i class="ph ph-file-pdf text-2xl"></i>
                                <span>View Offer Letter</span>
                            </div>
                            <i class="ph ph-arrow-right"></i>
                        </a>

                        <a href="${PROJECTS_URL}" target="_blank" class="action-card flex justify-between items-center bg-white border border-slate-200 hover:border-blue-300 rounded-xl p-4 font-semibold text-slate-700 hover:text-blue-700">
                            <div class="flex items-center gap-3">
                                <i class="ph ph-folder-open text-blue-500 text-2xl"></i>
                                <span>Access Project Files</span>
                            </div>
                            <i class="ph ph-arrow-up-right text-slate-400"></i>
                        </a>
                    </div>
                </div>
            `;
            quickLinksSection.classList.remove("hidden");
            
        } else {
            // Keep the form visible if no record is found so they can fix a typo
            searchForm.classList.remove("hidden");

            resultContent.innerHTML = `
                <div class="bg-red-50 border-2 border-red-100 rounded-[1.5rem] p-6 text-center shadow-sm">
                    <div class="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i class="ph ph-warning-circle text-3xl"></i>
                    </div>
                    <h3 class="text-lg font-bold text-red-700">No Record Found</h3>
                    <p class="text-red-500/80 mt-1 text-sm font-medium">Please verify your email or phone number and try again.</p>
                </div>
            `;
            quickLinksSection.classList.add("hidden");
        }

        resultContainer.classList.remove("hidden");

    } catch (error) {
        searchForm.classList.remove("hidden");
        resultContent.innerHTML = `
            <div class="bg-red-50 border-2 border-red-100 rounded-[1.5rem] p-6 text-center shadow-sm">
                <div class="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="ph ph-plugs-connected text-3xl"></i>
                </div>
                <h3 class="text-lg font-bold text-red-700">Connection Error</h3>
                <p class="text-red-500/80 mt-1 text-sm font-medium">Unable to reach the server. Please try again later.</p>
            </div>
        `;
        quickLinksSection.classList.add("hidden");
        resultContainer.classList.remove("hidden");

    } finally {
        setLoading(false);
    }
}
</script>

</body>
</html>
