<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Internship Info Lookup</title>
  <meta name="description" content="Look up your internship information with StaxTech. Enter your email or phone to get details.">
  <meta name="keywords" content="StaxTech, Internship, Lookup, Web Design, Graphic Design">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9005733002223091"
     crossorigin="anonymous"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Favicon (Inline SVG) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
  
  <!-- Font Awesome CDN for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* Custom styles */
    body {
      font-family: 'Inter', sans-serif;
      /* Animated gradient background */
      background: linear-gradient(-45deg, #0f172a, #1e293b, #334155, #0f172a);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    /* Custom glassmorphism effect for cards */
    .glass-card {
        background: rgba(30, 41, 59, 0.5); /* bg-slate-800 with 50% opacity */
        backdrop-filter: blur(10px);
        border: 1px solid rgba(51, 65, 85, 0.5); /* border-slate-700 with 50% opacity */
    }
  </style>
</head>

<body class="text-slate-300">

  <!-- Main Content Section -->
  <main class="flex flex-col items-center justify-center min-h-screen w-full p-4 sm:p-6 lg:p-8">
    <div class="w-full max-w-md mx-auto">
      
      <!-- Search Card -->
      <div class="glass-card rounded-2xl shadow-2xl shadow-blue-500/10 p-6 sm:p-8">
        <div class="text-center mb-8">
          <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-slate-700/50 border border-slate-600 mb-4">
            <i class="fas fa-satellite-dish text-3xl text-blue-400"></i>
          </div>
          <h1 class="text-2xl font-bold text-white">Internship Info Finder</h1>
          <p class="text-slate-400 mt-2">Enter your registered email or phone to get your details.</p>
        </div>
        
        <!-- Search Form -->
        <div class="space-y-4">
          <div class="relative">
            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
            <input type="text" id="inputField" placeholder="Enter Gmail or Phone number" class="w-full p-3 pl-12 bg-slate-900/50 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200" />
          </div>
          <button onclick="searchData()" class="w-full flex items-center justify-center gap-2 rounded-lg bg-blue-600 px-4 py-3 text-white font-semibold shadow-lg shadow-blue-600/20 hover:bg-blue-700 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-900 focus:ring-blue-500 transform hover:scale-105">
            <span>Search Info</span>
            <i class="fas fa-arrow-right"></i>
          </button>
        </div>

        <!-- Quick Actions -->
        <div class="mt-6 text-center">
            <a href="https://drive.google.com/drive/folders/1kvnKaleE7i_2soNfTs99K3ikfcqLlvY8?usp=drive_link" class="inline-flex items-center gap-2 text-sm font-medium text-blue-400 hover:text-blue-300 transition-colors" target="_blank">
                <i class="fas fa-folder-open"></i>
                <span>Download Project List</span>
            </a>
        </div>
      </div>
      
      <!-- Message Box for alerts -->
      <div id="messageBox" class="mt-4 text-center"></div>

      <!-- Spinner -->
      <div id="spinner" class="hidden my-6 text-center">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-blue-400"></div>
      </div>

      <!-- Results Card -->
      <div id="output" class="mt-6"></div>

    </div>
  </main>

  <script>
    // The API endpoint for the Google Apps Script
    const API_URL = 'https://script.google.com/macros/s/AKfycbySIfFfx5Hv26PwZ1IFQX2261MnzYxt6Gl1TF2RMPM8vDa_BKs7GRsP4mcuzLKgNg8ETw/exec';

    // DOM element references
    const inputField = document.getElementById('inputField');
    const outputDiv = document.getElementById("output");
    const spinner = document.getElementById("spinner");
    const messageBox = document.getElementById('messageBox');

    /**
     * Shows a message to the user.
     * @param {string} text - The message to display.
     * @param {string} type - The type of message ('error', 'success', 'info').
     */
    function showMessage(text, type = 'error') {
      let colorClasses = 'bg-red-500/20 text-red-300 border border-red-500/30';
      if (type === 'success') {
        colorClasses = 'bg-green-500/20 text-green-300 border border-green-500/30';
      } else if (type === 'info') {
        colorClasses = 'bg-blue-500/20 text-blue-300 border border-blue-500/30';
      }
      messageBox.innerHTML = `<div class="p-3 rounded-lg ${colorClasses}">${text}</div>`;
    }

    /**
     * Clears any messages and results from the UI.
     */
    function clearOutput() {
      outputDiv.innerHTML = "";
      messageBox.innerHTML = "";
    }

    /**
     * Handles the main search functionality.
     */
    async function searchData() {
      const query = inputField.value.trim();
      clearOutput();

      if (!query) {
        showMessage("Please enter your Gmail or phone number.");
        return;
      }

      spinner.classList.remove('hidden');

      try {
        const response = await fetch(`${API_URL}?query=${encodeURIComponent(query)}`);
        if (!response.ok) {
          throw new Error(`Network response was not ok: ${response.statusText}`);
        }
        const data = await response.json();
        
        if (data.error) {
          showMessage(data.error);
        } else {
          displayResults(data);
        }
      } catch (err) {
        showMessage("Something went wrong. Please check your connection and try again.");
        console.error("Fetch Error:", err);
      } finally {
        spinner.classList.add('hidden');
      }
    }

    /**
     * Renders the fetched data into the output container.
     * @param {object} data - The data object fetched from the API.
     */
    function displayResults(data) {
      // Mapping of API keys to user-friendly labels
      const fieldsToShow = {
        "Name": "Name",
        "Email Address": "Email",
        "Contact Number": "Phone",
        "College": "College",
        "domain": "Domain",
        "Current available batch is:*": "Batch",
        "deadline": "Deadline",
        "Merged Doc URL - Intership": "Offer Letter"
      };

      let html = '<div class="glass-card rounded-2xl shadow-2xl shadow-blue-500/10 p-6 sm:p-8 space-y-4 divide-y divide-slate-700">';
      html += '<h2 class="text-xl font-bold text-center text-white pb-4 border-b border-slate-700">Student Information</h2>';

      // Keep track of rendered fields to avoid duplicates
      const renderedKeys = new Set();
      
      for (const key in fieldsToShow) {
        if(renderedKeys.has(key)) continue;

        const label = fieldsToShow[key];
        const value = data[key] || "N/A";
        
        if (key === "Merged Doc URL - Intership" && typeof value === 'string' && value.startsWith("http")) {
          html += `
            <div class="pt-4">
              <a href="${value}" class="w-full flex items-center justify-center gap-2 rounded-lg bg-green-600 px-4 py-3 text-white font-semibold shadow-lg shadow-green-600/20 hover:bg-green-700 transition-all duration-200 transform hover:scale-105" target="_blank" download>
                  <i class="fas fa-file-pdf"></i>
                  <span>View Offer Letter</span>
              </a>
            </div>`;
        } else {
          html += `
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between pt-4">
              <strong class="text-sm font-medium text-slate-400">${label}</strong>
              <span class="text-slate-200 text-left sm:text-right mt-1 sm:mt-0 break-all">${value}</span>
            </div>`;
        }
        renderedKeys.add(key);
      }

      html += "</div>";
      outputDiv.innerHTML = html;
    }

    // Allow search on pressing Enter key
    inputField.addEventListener('keyup', (event) => {
        if (event.key === 'Enter') {
            searchData();
        }
    });

  </script>

</body>
</html>
