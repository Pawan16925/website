<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StaxTech Internship Portal</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>

    *{
      font-family:'Poppins',sans-serif;
    }

    body{
      background:
      radial-gradient(circle at top left,#2563eb22,transparent 30%),
      radial-gradient(circle at bottom right,#06b6d422,transparent 30%),
      linear-gradient(135deg,#020617,#0f172a,#111827);
      overflow:hidden;
    }

    .glass{
      background:rgba(255,255,255,0.07);
      backdrop-filter:blur(18px);
      border:1px solid rgba(255,255,255,0.1);
    }

    .glow{
      box-shadow:
      0 0 40px rgba(37,99,235,.25),
      0 0 80px rgba(6,182,212,.12);
    }

    .float{
      animation:float 5s ease-in-out infinite;
    }

    @keyframes float{
      0%{transform:translateY(0px);}
      50%{transform:translateY(-10px);}
      100%{transform:translateY(0px);}
    }

    .fadeIn{
      animation:fadeIn .7s ease;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(30px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .btnHover:hover{
      transform:translateY(-2px) scale(1.02);
    }

  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6">

  <div class="absolute top-0 left-0 w-80 h-80 bg-blue-500 opacity-20 blur-3xl rounded-full"></div>
  <div class="absolute bottom-0 right-0 w-80 h-80 bg-cyan-500 opacity-20 blur-3xl rounded-full"></div>

  <!-- SEARCH CARD -->

  <div id="searchCard"
       class="glass glow float fadeIn w-full max-w-md rounded-[32px] p-8 text-white relative z-10">

    <div class="text-center">

      <div class="w-24 h-24 mx-auto rounded-full bg-gradient-to-r from-blue-500 to-cyan-400 flex items-center justify-center text-4xl font-bold shadow-2xl">
        S
      </div>

      <h1 class="text-4xl font-extrabold mt-6 tracking-wide">
        StaxTech
      </h1>

      <p class="text-slate-300 mt-3 text-sm leading-relaxed">
        Internship Offer Letter & Project Portal
      </p>

    </div>

    <div class="mt-8 space-y-5">

      <input
        type="text"
        id="query"
        placeholder="Enter Email or Phone Number"
        class="w-full px-5 py-4 rounded-2xl bg-white/10 border border-white/20 outline-none text-white placeholder-slate-300 focus:border-cyan-400 transition-all duration-300"
      />

      <button
        onclick="findOfferLetter()"
        class="btnHover w-full py-4 rounded-2xl bg-gradient-to-r from-blue-500 to-cyan-400 transition-all duration-300 font-semibold shadow-2xl"
      >
        Find Documents
      </button>

    </div>

    <div id="loading"
         class="hidden text-center mt-6 text-cyan-300 font-medium animate-pulse">
      Verifying Student...
    </div>

    <div id="notFound"
         class="hidden text-center mt-6 text-red-400 font-semibold">
      No Record Found
    </div>

  </div>

<script>

async function findOfferLetter() {

  const query = document.getElementById("query").value.trim();

  const loading = document.getElementById("loading");
  const notFound = document.getElementById("notFound");

  loading.classList.remove("hidden");
  notFound.classList.add("hidden");

  const API_URL = "https://script.google.com/macros/s/AKfycbxxgPuh9En6T-Yawa5xgNUQYq1zb9XU9nc6pMUDqP3BPcDkVfALgAzovOIb5htXhG5aZA/exec";

  try {

    const response = await fetch(`${API_URL}?query=${encodeURIComponent(query)}`);

    const data = await response.json();

    loading.classList.add("hidden");

    if(data.status === "success") {

      // HIDE SEARCH CONSOLE
      document.getElementById("searchCard").innerHTML = `

      <div class="fadeIn text-center">

        <div class="w-28 h-28 mx-auto rounded-full bg-gradient-to-r from-green-400 to-emerald-500 flex items-center justify-center text-5xl shadow-2xl">
          ✓
        </div>

        <h2 class="text-3xl font-bold mt-6">
          Student Verified
        </h2>

        <p class="text-slate-300 mt-4 text-lg font-medium">
          ${data.name}
        </p>

        <div class="mt-3 inline-block px-4 py-2 rounded-full bg-cyan-500/20 text-cyan-300 text-sm">
          ${data.domain}
        </div>

        <div class="mt-8 space-y-4">

          <a
            href="${data.offerLetter}"
            target="_blank"
            class="btnHover block w-full py-4 rounded-2xl bg-gradient-to-r from-green-400 to-emerald-500 font-semibold shadow-2xl transition-all duration-300"
          >
            Download Offer Letter
          </a>

          <a
            href="https://drive.google.com/drive/folders/1kvnKaleE7i_2soNfTs99K3ikfcqLlvY8"
            target="_blank"
            class="btnHover block w-full py-4 rounded-2xl bg-gradient-to-r from-purple-500 to-pink-500 font-semibold shadow-2xl transition-all duration-300"
          >
            Download Internship Projects
          </a>

        </div>

        <div class="mt-8 p-4 rounded-2xl bg-white/5 border border-white/10">

          <p class="text-sm text-slate-300 leading-relaxed">
            Your internship documents are verified and generated successfully.
          </p>

        </div>

        <p class="text-xs text-slate-500 mt-6">
          © 2026 StaxTech Internship Program
        </p>

      </div>

      `;

    } else {

      notFound.classList.remove("hidden");

    }

  } catch(error) {

    console.log(error);

    loading.classList.add("hidden");
    notFound.classList.remove("hidden");

  }

}

</script>

</body>
</html>
