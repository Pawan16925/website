name: StaxTech Topic Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch trends
        run: python automation/generator/trend_fetcher.py

      - name: Score relevant topics
        run: python automation/generator/topic_discovery.py

      - name: Commit topic candidates
        run: |
          git config user.name "staxtech-automation"
          git config user.email "actions@users.noreply.github.com"
          git add automation/data/trend-candidates.json automation/data/topic-candidates.json
          git diff --cached --quiet || git commit -m "chore: update automated topic candidates"
          git push
