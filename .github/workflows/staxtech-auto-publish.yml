name: StaxTech Automatic Article Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: staxtech-auto-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Fetch current trends
        run: python automation/generator/trend_fetcher.py

      - name: Fetch Search Console queries
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: python automation/generator/search_console_fetcher.py

      - name: Select high-potential topic
        run: python automation/generator/topic_discovery.py

      - name: Generate SEO article
        run: python automation/generator/article_generator.py

      - name: Build article index
        run: python automation/generator/build_article_index.py

      - name: Rebuild sitemap
        run: python automation/generator/build_sitemap.py

      - name: Validate generated site
        run: python automation/generator/validate_pipeline.py

      - name: Commit generated content
        run: |
          git config user.name "staxtech-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/data/ articles/ sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "No content changes to publish."
            exit 0
          fi
          git commit -m "chore: publish hourly SEO technology guide"
          git push origin HEAD:main
