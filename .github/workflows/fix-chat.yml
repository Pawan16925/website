name: Fix CodeCraft Chat
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'fix: secure chatbot frontend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update chatbot endpoint and remove browser key
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r"const CODECRAFT_API_KEY\s*=\s*['\"][^'\"]*['\"]\s*;", "const CODECRAFT_API_KEY='';", s, count=1)
          s = re.sub(r"const CODECRAFT_API_URL\s*=\s*['\"]https://codecraftapi\.com/v1/chat/completions['\"]\s*;", "const CODECRAFT_API_URL='/api/chat';", s, count=1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: secure chatbot frontend' || exit 0
          git push
