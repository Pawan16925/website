<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | StaxTech Portal</title>
  <!-- Favicon and Theme Color -->
    <link rel="icon" href="assets/favicon.png" type="image/png" />



       <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9005733002223091"
     crossorigin="anonymous"></script>
    <!-- Using Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons for modern scalable icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Google Fonts: Plus Jakarta Sans for a modern, tech-focused look -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f4ff',
                            100: '#e1e9ff',
                            500: '#3b62ff',
                            600: '#264bf2',
                            900: '#14257a',
                        },
                        accent: {
                            400: '#38bdf8',
                            500: '#0ea5e9',
                        }
                    },
                    boxShadow: {
                        'glow': '0 0 20px rgba(59, 98, 255, 0.3)',
                        'inner-light': 'inset 0 2px 4px 0 rgba(255, 255, 255, 0.3)',
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'slide-up': 'slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'wobble': 'wobble 4s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        slideUp: {
                            '0%': { opacity: 0, transform: 'translateY(20px)' },
                            '100%': { opacity: 1, transform: 'translateY(0)' },
                        },
                        wobble: {
                            '0%, 100%': { transform: 'rotate(-3deg)' },
                            '50%': { transform: 'rotate(3deg)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Modern Glassmorphism Background (Same as main portal) */
        body {
            background: linear-gradient(135deg, #f0f4ff 0%, #e1e9ff 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Abstract Background Shapes */
        .bg-shape {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
            animation: float 10s ease-in-out infinite alternate;
        }
        
        .shape-1 {
            top: -10%;
            left: -10%;
            width: 40vw;
            height: 40vw;
            background: rgba(59, 98, 255, 0.3); /* Brand color */
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
        }

        .shape-2 {
            bottom: -10%;
            right: -10%;
            width: 35vw;
            height: 35vw;
            background: rgba(56, 189, 248, 0.3); /* Accent color */
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            animation-delay: -5s;
        }

        /* 404 Specific Glitch/Text effect */
        .text-glitch {
            position: relative;
        }
        .text-glitch::before, .text-glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }
        .text-glitch::before {
            left: 2px;
            text-shadow: -2px 0 #38bdf8;
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim 3s infinite linear alternate-reverse;
        }
        .text-glitch::after {
            left: -2px;
            text-shadow: -2px 0 #3b62ff;
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }
        
        @keyframes glitch-anim {
            0% { clip: rect(65px, 9999px, 100px, 0); }
            5% { clip: rect(52px, 9999px, 74px, 0); }
            10% { clip: rect(79px, 9999px, 106px, 0); }
            15% { clip: rect(75px, 9999px, 17px, 0); }
            20% { clip: rect(86px, 9999px, 56px, 0); }
            25% { clip: rect(11px, 9999px, 92px, 0); }
            30% { clip: rect(54px, 9999px, 14px, 0); }
            35% { clip: rect(72px, 9999px, 12px, 0); }
            40% { clip: rect(1px, 9999px, 14px, 0); }
            45% { clip: rect(2px, 9999px, 83px, 0); }
            50% { clip: rect(41px, 9999px, 1px, 0); }
            55% { clip: rect(6px, 9999px, 20px, 0); }
            60% { clip: rect(75px, 9999px, 100px, 0); }
            65% { clip: rect(98px, 9999px, 12px, 0); }
            70% { clip: rect(12px, 9999px, 59px, 0); }
            75% { clip: rect(20px, 9999px, 49px, 0); }
            80% { clip: rect(13px, 9999px, 12px, 0); }
            85% { clip: rect(66px, 9999px, 102px, 0); }
            90% { clip: rect(31px, 9999px, 60px, 0); }
            95% { clip: rect(84px, 9999px, 1px, 0); }
            100% { clip: rect(3px, 9999px, 47px, 0); }
        }

        /* Card Hover Effects */
        .action-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .action-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(59, 98, 255, 0.1), 0 8px 10px -6px rgba(59, 98, 255, 0.1);
            border-color: #e1e9ff;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 sm:p-6 lg:p-8 font-sans text-slate-800 antialiased selection:bg-brand-500 selection:text-white">

    <!-- Ambient Background Elements -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <main class="w-full max-w-lg relative z-10 animate-slide-up">
        
        <!-- Glassmorphism Container -->
        <div class="bg-white/80 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/50 overflow-hidden">
            
            <header class="relative pt-12 pb-10 px-8 text-center overflow-hidden bg-gradient-to-br from-brand-600 to-brand-900 text-white">
                <!-- Abstract header decor -->
                <div class="absolute inset-0 opacity-10">
                    <svg class="absolute w-full h-full" viewBox="0 0 100 100" preserveAspectRatio="none">
                        <path d="M0,0 C30,40 70,10 100,50 L100,0 Z" fill="currentColor" opacity="0.3"></path>
                        <path d="M0,0 C40,20 60,80 100,30 L100,0 Z" fill="currentColor" opacity="0.2"></path>
                    </svg>
                </div>

                <div class="relative z-10 flex flex-col items-center">
                    <div class="w-24 h-24 bg-white/10 backdrop-blur-md rounded-full flex items-center justify-center mb-6 shadow-inner-light border border-white/20 animate-wobble">
                        <i class="ph ph-ghost text-5xl text-white"></i>
                    </div>
                    <h1 class="text-6xl sm:text-7xl font-extrabold tracking-tighter mb-2 text-glitch" data-text="404">404</h1>
                    <p class="text-brand-100 font-medium text-base sm:text-lg opacity-90 mt-2">Looks like you're lost in space.</p>
                </div>
                
                <!-- Curved bottom edge -->
                <div class="absolute bottom-0 left-0 right-0">
                    <svg viewBox="0 0 1440 120" class="w-full h-[30px] fill-white/80" preserveAspectRatio="none">
                        <path d="M0,120 C320,120 420,0 720,0 C1020,0 1120,120 1440,120 L1440,120 L0,120 Z"></path>
                    </svg>
                </div>
            </header>

            <div class="p-8 sm:p-10 pt-6 text-center">
                
                <h2 class="text-xl font-bold text-slate-800 mb-2">Page Not Found</h2>
                <p class="text-slate-500 text-sm mb-8 leading-relaxed max-w-sm mx-auto">
                    The page you are looking for might have been removed, had its name changed, or is temporarily unavailable. Let's get you back on track.
                </p>
                
                <div class="space-y-3">
                    <!-- Link back to main portal -->
                    <a href="/" 
                       class="relative w-full overflow-hidden group flex justify-center items-center py-4 px-6 rounded-xl shadow-lg shadow-brand-500/30 text-base font-bold text-white bg-brand-600 hover:bg-brand-700 hover:shadow-glow focus:outline-none focus:ring-4 focus:ring-brand-500/50 transition-all duration-300 transform active:scale-[0.98]">
                        <!-- Button hover effect background -->
                        <div class="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:animate-[shimmer_1.5s_infinite] pointer-events-none"></div>
                        <span class="flex items-center gap-2 relative z-10">
                            <i class="ph ph-house text-xl"></i> Return to Portal
                        </span>
                    </a>

                   
                </div>
            </div>
            
            <footer class="bg-slate-50/50 px-8 py-5 border-t border-slate-100/50 text-center flex flex-col items-center gap-2">
                <div class="flex gap-3 text-slate-400 mb-1">
                    <i class="ph ph-lifebuoy text-lg"></i>
                </div>
                <p class="text-xs font-medium text-slate-500">&copy; <span id="year"></span> StaxTech Inc. All rights reserved.</p>
            </footer>
        </div>
    </main>

    <script>
        // Custom Tailwind config for the shimmer animation
        tailwind.config.theme.extend.keyframes.shimmer = {
            '100%': { transform: 'translateX(100%)' }
        };

        // Set current year dynamically
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
